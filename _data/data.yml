experiences:
  title: Experiences
  info:
  - role: Teaching assistant
    time: 2024 - 2026
    companies: The City of Stockholm, Pamoja, Stockholm
    details: |
      I spent one year as a teaching assistant in a compulsory school for pupils with intellectual disabilities.
      A most rewarding and humbling experience. With no relevant education there was a lot to learn and I had great colleges helping me through out.
      Everything from how to balance social and pedagogical interactions with the students and foster interaction between the students,
      to the importance of how you tailor your methods and routines to the students individual needs. 
      The second year I worked in two schools. In the first one I was a teaching assistant for a class of second graders. 
      That was a lot of fun and my recent teaching experiences where of good use when interacting with the students.
      The second school I was recommended to the school by my employeer based on conversations with 
      the compulsory school for pupils with intellectual disabilities. I had a great time there as well and was offered a permanent position but by then my interest in learning programming had peaked.
      Although a very rewarding occupation and for my short stint back in the school system but on the other side this time, it was immensly educative, 
      I felt there are other personally more mentally stimulating occupations I prefer. I also appreciated the experience of being a cog in a larger system.
        - Immensly socially and logistically educative
        - A rewarding experience in setting short, medium and long term goals, reviewing and revising them
  
  - role: Barista
    time: 2018 - 2023
    company: Espresso House, Stockholm
    details: |
      After spending time studying and playing football my whole life this was an exercise in work life balance.
      Although it was a physically taxing and often stressful job, I had a lot spear time to socialize and experience adult life outside the school system.
      As a barista in the most frequented coffe shop in a tourist friendly city there were many high intensity periods where fair and efficient team work was essential.
      In a high turnover market this shop was no different. I was soon among the more experienced baristas and got the opportunity to teach newer colleges, 
      delegate tasks and advice on routines.
        - High intensity, short/medium term solutions 
        - monthly performance receipt to revise with colleges

